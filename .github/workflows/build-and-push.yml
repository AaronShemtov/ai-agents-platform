name: build-and-push

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing is built or tested on a workstation for this project, so this job is the
  # only thing standing between a typo and a CrashLoopBackOff. It also proves the
  # dependency set resolves at all: mcp and openai require httpx2 while
  # python-telegram-bot pulls the older httpx, and they have to coexist.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Import every entrypoint
        # A missing import or a name that moved in mcp 2.x shows up here rather than
        # after the image is already running in the cluster.
        run: |
          python -c "import agentcore.__main__"
          python -c "import mcp_cluster.__main__"
          python -c "import mcp_cloudflare.__main__"

      - name: Tests
        run: pytest -q

  build-push:
    needs: test
    # Only publish from main; PRs stop after the test job.
    if: github.event_name != 'pull_request'
    # Native arm64 runner (free for public repositories), so the build is not
    # emulated. Under QEMU on an amd64 runner `python -m venv` alone took 43s.
    # If this label is ever unavailable the job fails immediately with "no runner
    # matching labels" — revert to ubuntu-latest and restore the QEMU step below.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No QEMU: the runner is already arm64, so there is nothing to emulate.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: il-jerusalem-1.ocir.io
          username: axiwhc5fgu9i/shemtov.aaron@gmail.com
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      # We tag the image three ways:
      #   - 0.0.<run_number> — auto-incrementing semver used by Flux ImagePolicy.
      #     github.run_number monotonically increases per workflow file, so each
      #     successful build gets a strictly higher version than the previous.
      #   - <short-sha>       — immutable for traceability / ad-hoc rollback.
      #   - latest            — convenience for ad-hoc pulls; never used in k8s.
      - name: Resolve image tags
        id: tag
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ver=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # One image, three entrypoints: the agent and both MCP servers share the same
      # dependencies, so the Deployments differ only by `command:`. That keeps this to
      # one CI pipeline and one Flux ImagePolicy instead of three.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            il-jerusalem-1.ocir.io/axiwhc5fgu9i/ai-agents-platform:${{ steps.tag.outputs.ver }}
            il-jerusalem-1.ocir.io/axiwhc5fgu9i/ai-agents-platform:${{ steps.tag.outputs.sha }}
            il-jerusalem-1.ocir.io/axiwhc5fgu9i/ai-agents-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Version tag (used by Flux): \`${{ steps.tag.outputs.ver }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- SHA tag (traceability):     \`${{ steps.tag.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Convenience tag:            \`latest\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify Telegram — success
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO:     ${{ github.repository }}
          SHA:      ${{ steps.tag.outputs.sha }}
          VER:      ${{ steps.tag.outputs.ver }}
          ACTOR:    ${{ github.actor }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Image name = repo basename — keeps this snippet identical
          # across all the service repos.
          IMAGE_NAME="${REPO##*/}"
          IMAGE_FULL="il-jerusalem-1.ocir.io/axiwhc5fgu9i/${IMAGE_NAME}:${VER}"

          {
            printf '%s\n' "✅ <b>Build OK</b> · <code>${IMAGE_NAME}</code>"
            printf '\n'
            printf '%s\n' "<b>Image</b>: <code>${IMAGE_FULL}</code>"
            printf '%s\n' "<b>SHA</b>: <code>${SHA}</code>"
            printf '%s\n' "<b>By</b>: ${ACTOR}"
            printf '%s\n' "<a href=\"${RUN_URL}\">workflow run</a>"
          } > /tmp/tg-msg.txt

          # `-o /dev/null` with no --fail is how this went quiet for two days: curl
          # exits 0 on an HTTP 401 as readily as on a 200, so a rejected message left
          # a green step and nobody knew. Telegram also answers 200 with
          # {"ok":false} for some errors, so the status code alone is not enough —
          # the body has to be read.
          #
          # The token never reaches the log: it is only ever in the URL, and what is
          # printed is Telegram's own `description` field.
          code=$(curl -sS -o /tmp/tg-resp.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text@/tmp/tg-msg.txt" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true")

          if grep -q '"ok":true' /tmp/tg-resp.json; then
            echo "Telegram accepted the notification (HTTP $code)"
          else
            echo "::error::Telegram rejected the notification (HTTP $code)"
            # Telegram's own wording, e.g. "Unauthorized" or "chat not found".
            # The response never contains the token.
            cat /tmp/tg-resp.json
            echo "Check the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets."
            exit 1
          fi

      - name: Notify Telegram — failure
        if: failure()
        # The job is already red for its own reason. A Telegram problem on top of
        # that should be visible in the log but must not become the headline, or the
        # actual failure gets buried under it.
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO:     ${{ github.repository }}
          ACTOR:    ${{ github.actor }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          IMAGE_NAME="${REPO##*/}"

          {
            printf '%s\n' "❌ <b>Build FAILED</b> · <code>${IMAGE_NAME}</code>"
            printf '\n'
            printf '%s\n' "<b>By</b>: ${ACTOR}"
            printf '%s\n' "<a href=\"${RUN_URL}\">workflow run · check logs</a>"
          } > /tmp/tg-msg.txt

          # `-o /dev/null` with no --fail is how this went quiet for two days: curl
          # exits 0 on an HTTP 401 as readily as on a 200, so a rejected message left
          # a green step and nobody knew. Telegram also answers 200 with
          # {"ok":false} for some errors, so the status code alone is not enough —
          # the body has to be read.
          #
          # The token never reaches the log: it is only ever in the URL, and what is
          # printed is Telegram's own `description` field.
          code=$(curl -sS -o /tmp/tg-resp.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text@/tmp/tg-msg.txt" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true")

          if grep -q '"ok":true' /tmp/tg-resp.json; then
            echo "Telegram accepted the notification (HTTP $code)"
          else
            echo "::error::Telegram rejected the notification (HTTP $code)"
            # Telegram's own wording, e.g. "Unauthorized" or "chat not found".
            # The response never contains the token.
            cat /tmp/tg-resp.json
            echo "Check the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets."
            exit 1
          fi
